; A theme pack for the card: copy this file to Themes/<name>.ini on the
; microSD card and it appears under Settings > Appearance > Theme pack.
; These are the Midnight colours, the same ones built into the player, so
; copied as it is this file changes nothing; edit the colours to make a
; theme of your own.
;
; Every colour is #rrggbb. A key or a whole section left out keeps the
; Classic theme's colour for it. "accent" is the theme's own accent, used
; until one of the six preset accents is chosen on the Appearance page.

[theme]
name = Midnight

[dark]
screen_bg = #111820
surface = #1b2531
surface_pressed = #273544
panel = #0d1218
cover_bg = #0d1218
text_primary = #eef2f7
text_secondary = #9fb0c2
accent = #4f9cf0

[light]
screen_bg = #eef3f8
surface = #ffffff
surface_pressed = #dbe5f0
panel = #ffffff
cover_bg = #dfe7ef
text_primary = #1f2a36
text_secondary = #5f6f80
accent = #2f7fd6
